name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test-linux:
    name: core tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The WinForms tray project only builds on Windows, so test the project directly here.
      - run: dotnet test tests/WlanToggle.Core.Tests -c Release

  build-windows:
    name: build, test & publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Publish single-file exe
        run: >
          dotnet publish src/WlanToggle.Tray -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/WlanToggle
      - uses: actions/upload-artifact@v4
        with:
          name: WlanToggle-win-x64
          path: artifacts/WlanToggle/WlanToggle.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
