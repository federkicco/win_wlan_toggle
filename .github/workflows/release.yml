name: Release

# Publish a GitHub Release with the Windows exe whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/WlanToggle.Tray -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$($version -replace '-.*$','') -o artifacts/WlanToggle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/WlanToggle/WlanToggle.exe -DestinationPath WlanToggle-win-x64.zip
          $hash = (Get-FileHash WlanToggle-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  WlanToggle-win-x64.zip" | Out-File -Encoding ascii WlanToggle-win-x64.zip.sha256

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @("release", "create", "${{ github.ref_name }}",
                    "WlanToggle-win-x64.zip", "WlanToggle-win-x64.zip.sha256",
                    "--title", "WlanToggle ${{ github.ref_name }}", "--generate-notes")
          if ("${{ github.ref_name }}" -like "*-*") { $args += "--prerelease" }
          gh @args
